<script>
(function () {
  const DB = "homeledger", STORE = "kv";
  function open() {
    return new Promise((ok, no) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    });
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((ok, no) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      req.onsuccess = () => ok(req.result);
      req.onerror = () => no(req.error);
    });
  }
  window.storage = {
    async get(key) {
      const v = await tx("readonly", (s) => s.get(key));
      if (v === undefined) throw new Error("not found");
      return { key, value: v, shared: false };
    },
    async set(key, value) { await tx("readwrite", (s) => s.put(value, key)); return { key, value, shared: false }; },
    async delete(key) { await tx("readwrite", (s) => s.delete(key)); return { key, deleted: true, shared: false }; },
    async list(prefix = "") {
      const keys = await tx("readonly", (s) => s.getAllKeys());
      return { keys: keys.filter((k) => String(k).startsWith(prefix)), prefix, shared: false };
    },
  };
})();
</script>

<script>
const NEED = [["React",["https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js","https://unpkg.com/react@18.3.1/umd/react.production.min.js"]],["ReactDOM",["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js","https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"]],["PropTypes",["https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js","https://unpkg.com/prop-types@15.8.1/prop-types.min.js"]],["Recharts",["https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js","https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.js","https://unpkg.com/recharts@2.12.7/umd/Recharts.js"]],["THREE",["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://unpkg.com/three@0.128.0/build/three.min.js"]]];
const boot = document.getElementById("boot");
const say = (t) => { if (boot) boot.innerHTML = t; };

function loadOne(urls, i) {
  i = i || 0;
  return new Promise((ok, fail) => {
    if (i >= urls.length) return fail(new Error("every source failed"));
    const s = document.createElement("script");
    s.src = urls[i];
    s.crossOrigin = "anonymous";
    s.onload = () => ok(urls[i]);
    s.onerror = () => loadOne(urls, i + 1).then(ok, fail);
    document.head.appendChild(s);
  });
}

(async function () {
  const failed = [];
  for (const [name, urls] of NEED) {
    if (window[name]) continue;
    say("Loading Home Ledger\u2026<br><span style='font-size:12px;opacity:.6'>" + name + "</span>");
    try { await loadOne(urls); } catch (e) { failed.push(name); }
    if (!window[name]) { if (!failed.includes(name)) failed.push(name); }
  }
  if (failed.length) {
    say("<b style='color:#F5F6F7'>Couldn't load " + failed.join(", ") + "</b><br><br>" +
      "This happens when the page is opened somewhere that blocks outside scripts \u2014 " +
      "including inside the Claude app.<br><br>" +
      "Host the file instead: go to <b style='color:#F5F6F7'>app.netlify.com/drop</b>, " +
      "drop this file on it, then open the address it gives you in Safari.<br><br>" +
      "<span style='font-size:12px;opacity:.6'>If you are already on a hosted address, check your connection and reload.</span>");
    return;
  }
  try {
    HL_START();
  } catch (e) {
    say("<b style='color:#F5F6F7'>Could not start</b><br><br><span style='color:#FF5A4E;font-family:monospace;font-size:12px'>" +
      (e && e.message ? e.message : e) + "</span>");
  }
})();
</script>
